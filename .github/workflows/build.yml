
name: Build GoreBox ESP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install BepInEx template
        shell: pwsh
        run: |
          dotnet new install BepInEx.Templates::2.0.0-be.4 --nuget-source https://nuget.bepinex.dev/v3/index.json

      - name: Create IL2CPP project
        shell: pwsh
        run: |
          dotnet new bep6plugin_unity_il2cpp -n GoreBoxESP

      - name: Create test plugin
        shell: pwsh
        run: |
          @'
          using BepInEx;
          using BepInEx.Unity.IL2CPP;

          [BepInPlugin("gorebox.visuals.esp", "GoreBox ESP", "1.0.0")]
          [BepInProcess("HuesBox.exe")]
          public class GoreBoxESPPlugin : BasePlugin
          {
              public override void Load()
              {
                  Log.LogInfo("GoreBox ESP plugin loaded!");
              }
          }
          '@ | Set-Content GoreBoxESP/Plugin.cs -Encoding utf8

      - name: Build DLL
        shell: pwsh
        run: |
          dotnet build GoreBoxESP/GoreBoxESP.csproj -c Release

      - name: Collect DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem GoreBoxESP/bin/Release -Filter GoreBoxESP.dll -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/]+ref[\\/]' } |
            Select-Object -First 1

          if (-not $dll) {
            throw "GoreBoxESP.dll was not found"
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $dll.FullName dist/GoreBoxESP.dll

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: GoreBoxESP
          path: dist/GoreBoxESP.dll
